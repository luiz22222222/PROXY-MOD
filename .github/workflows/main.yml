
name: Build PROXY MOD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        run: unzip -q PROXY_MOD_projeto_android.zip -d extracted

      - name: Compilar APK
        run: |
          cd extracted/ProxyModProject
          gradle :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PROXY-MOD-APK
          path: extracted/ProxyModProject/app/build/outputs/apk/debug/*.apk
          
